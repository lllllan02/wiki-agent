# 程序首次启动会自动生成 config.yaml，本文件提供字段说明。省略字段沿用 default 标签。
# 所有配置统一保存在 config.yaml，修改后重新启动服务。
model:
  api_key: ""                 # 必填；空默认值只用于初始化，不代表可调用模型。
  name: ""                    # 必填；请填写服务商支持工具调用的模型名。
  base_url: ""                # 兼容服务填写完整 API 地址；DeepSeek 使用 https://api.deepseek.com/v1。
  timeout: 60s                 # 使用带单位的时间，避免把毫秒误写成秒。

wiki:
  max_read_bytes: 16384        # 读取上限避免一次把大笔记全部放入上下文，最多 1 MiB；知识库目录在网页中选择。

agent:
  max_steps: 8                 # 一步指一次模型请求，同一步可顺序执行多个工具调用。

server:
  address: "127.0.0.1:8080"  # 浏览器访问的本地地址。
