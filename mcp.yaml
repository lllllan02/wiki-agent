# 现成 MCP 注册表。npm ci --prefix mcp 安装已锁定的 Node.js 服务器。
# ${PROJECT_ROOT} = 本注册表所在目录；${WIKI_ROOT} = 当前 Web 会话选择的 Wiki。
# 需要密钥时复制为 mcp.local.yaml，并在 config.yaml 中引用它；不要提交凭据。
# enabled 表示向 Agent 开放；tools 只列本阶段使用的能力，不自动开放服务端所有工具。
servers:
  - name: filesystem
    enabled: true
    transport: stdio
    command: node
    args: ["${PROJECT_ROOT}/mcp/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js", "${WIKI_ROOT}"]
    tools: [list_directory, search_files, read_text_file, get_file_info]
    path_parameters: [path]

  - name: ripgrep
    enabled: true
    transport: stdio
    command: node
    args: ["${PROJECT_ROOT}/mcp/node_modules/mcp-ripgrep/dist/index.js"]
    tools: [search]
    path_parameters: [path]

  - name: tavily
    enabled: false # 填写自己的 API key 后启用；查询将发送到 Tavily。
    transport: streamable_http
    url: https://mcp.tavily.com/mcp/
    headers:
      Authorization: "Bearer REPLACE_WITH_TAVILY_API_KEY"
    tools: [tavily-search, tavily-extract]

  - name: playwright
    enabled: false # 已安装服务器；网页任务阶段再开放，会话当前按单轮运行隔离。
    transport: stdio
    command: node
    args: ["${PROJECT_ROOT}/mcp/node_modules/@playwright/mcp/cli.js", "--headless", "--isolated", "--browser", "chrome"]
    # 截图多模态、点击/输入权限与浏览器状态恢复在 L23 完善后再加入。
    tools: [browser_navigate, browser_tabs, browser_snapshot, browser_close]

  - name: git
    enabled: false # 先安装 mcp/requirements.txt；只适用于 Git 知识库。
    transport: stdio
    command: "${PROJECT_ROOT}/.cache/mcp-python/bin/python"
    args: ["-m", "mcp_server_git", "--repository", "${WIKI_ROOT}"]
    tools: [git_status, git_diff_unstaged, git_diff_staged, git_log]
    path_parameters: [repo_path]

  - name: memory
    enabled: false # L19 再开放存储/删除；当前白名单仅用于读取已有记忆。
    transport: stdio
    command: node
    args: ["${PROJECT_ROOT}/mcp/node_modules/@modelcontextprotocol/server-memory/dist/index.js"]
    env:
      MEMORY_FILE_PATH: "${WIKI_ROOT}/.wiki-agent-memory.jsonl"
    tools: [search_nodes, open_nodes]

  - name: obsidian
    enabled: false # maxkuminov/obsidian-mcp 需要单独部署 Linux + PostgreSQL 服务。
    transport: streamable_http
    url: "" # 部署后的 /mcp 地址。
    headers:
      Authorization: "Bearer REPLACE_WITH_OBSIDIAN_API_KEY"
    bound_wiki: "" # 远程 vault 对应的本地绝对目录，防止页面切换 Wiki 后仍访问旧库。
    tools: [get_backlinks, get_neighborhood]
